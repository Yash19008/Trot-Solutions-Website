name: Deploy to Production

# Triggers on every push to the `latest` branch (production branch)
on:
  push:
    branches:
      - latest

# Prevent concurrent deployments — cancel any in-progress run if a new push arrives
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────
  # JOB 1: BUILD & VALIDATE
  # Runs in GitHub's cloud — catches build/type errors before touching the server
  # ─────────────────────────────────────────────────
  build:
    name: Build & Type-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generate Prisma client so the TypeScript compiler can resolve it.
      # A stub DATABASE_URL is used — no real DB needed for a build check.
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build Next.js (production)
        run: npm run build
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

  # ─────────────────────────────────────────────────
  # JOB 2: DEPLOY
  # SSHs into the production server after the build job passes
  # ─────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build       # Only runs if the build job succeeds
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /var/www/trot-solutions

            echo "==> Pulling latest code..."
            git fetch --all
            git reset --hard origin/latest

            echo "==> Installing production dependencies..."
            npm ci --omit=dev

            echo "==> Generating Prisma Client..."
            npx prisma generate

            echo "==> Applying database migrations..."
            npx prisma migrate deploy

            echo "==> Building Next.js..."
            npm run build

            echo "==> Reloading PM2 (zero-downtime)..."
            pm2 reload trot-website --update-env

            echo "==> Deployment complete!"
            pm2 status
